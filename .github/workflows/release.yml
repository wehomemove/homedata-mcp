name: Release homedata-mcp to PyPI

# Triggers ONLY on tags shaped `v*` (e.g. v0.1.2). Commit pushes and PRs do not trigger this workflow.
on:
  push:
    tags:
      - 'v*'

# Never cancel an in-flight publish — if two tags land back-to-back we want
# both to complete. Group by ref so concurrent runs on the same tag queue.
concurrency:
  group: release-homedata-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Python 3.13
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distributions with twine
        run: python -m twine check dist/*

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: homedata-mcp-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI via OIDC
    needs: build
    runs-on: ubuntu-latest
    # OIDC token for PyPI trusted publishing — no API token needed.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: homedata-mcp-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # release/v1 (v1.12.4)
        with:
          packages-dir: dist/
