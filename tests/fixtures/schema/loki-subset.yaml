# A cut-down stand-in for loki's OpenAPI schema, carrying only the paths these
# tests need and the parameters loki really declares for them (read from the live
# schema at https://api.homedata.co.uk/api/schema/yaml/, 2026-09-18).
openapi: 3.0.3
info:
  title: Stand-in
  version: 1.0.0
paths:
  # Verbatim path from https://api.homedata.co.uk/api/schema/yaml/, fetched 2026-10-08.
  /address/match/:
    get:
      operationId: address_match_retrieve
      description: Resolve an address and postcode using the shared address-resolution
        ladder, including flats, units and tenements. A unique match returns the same
        body as address retrieve at level=address plus address_resolution metadata
        and costs 5 tokens. Weak fuzzy matches are explicitly flagged. No match or
        multiple matches return 422 without candidates and cost no tokens. Enrichment
        parameters (level, fields, with) do not apply.
      summary: Match one address to one property
      parameters:
      - in: query
        name: address
        schema:
          type: string
        description: Full address, including any flat or unit.
        required: true
      - in: query
        name: postcode
        schema:
          type: string
        description: Property postcode; spacing and case are normalised.
        required: true
      tags:
      - Address Lookup
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                description: Address retrieve body at level=address with resolution
                  metadata.
                properties:
                  address_resolution:
                    type: object
                    properties:
                      method:
                        type: string
                      resolution_grade:
                        type: string
                        enum:
                        - exact
                        - strong
                        - weak
                      matched_address:
                        type: string
                      flagged:
                        type: boolean
                        description: True for a weak fuzzy match.
                    required:
                    - method
                    - resolution_grade
                    - matched_address
                    - flagged
                required:
                - address_resolution
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
          description: ''
        '422':
          content:
            application/json:
              schema:
                type: object
                properties:
                  reason:
                    type: string
                    enum:
                    - no_match
                    - multiple_matches
                required:
                - reason
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
          description: ''
  /calculators/mortgage/:
    get:
      parameters:
      - {in: query, name: price, required: true, schema: {type: integer}}
      - {in: query, name: deposit, required: true, schema: {type: integer}}
      - {in: query, name: rate, required: true, schema: {type: number}}
      - {in: query, name: term, required: false, schema: {type: integer}}
  /schools/nearby/:
    get:
      parameters:
      - {in: query, name: postcode, required: false, schema: {type: string}}
      - {in: query, name: radius_km, required: false, schema: {type: number}}
  /risks/{risk_type}/:
    get:
      parameters:
      - {in: path, name: risk_type, required: true, schema: {type: string}}
      - {in: query, name: uprn, required: true, schema: {type: integer}}
  /property/{uprn}/{tier}/:
    get:
      parameters:
      - {in: path, name: uprn, required: true, schema: {type: integer}}
      - {in: path, name: tier, required: true, schema: {type: string}}
      - {in: query, name: with, required: false, schema: {type: string}}
